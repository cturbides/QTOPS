# Blue-Green Deployment Configuration
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway-blue
  namespace: production
  labels:
    app: api-gateway
    version: blue
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api-gateway
      version: blue
  template:
    metadata:
      labels:
        app: api-gateway
        version: blue
    spec:
      containers:
      - name: api-gateway
        image: ghcr.io/qtops/api-gateway:latest
        ports:
        - containerPort: 3001
        env:
        - name: NODE_ENV
          value: "production"
        - name: API_GATEWAY_PORT
          value: "3001"
        - name: CONSUL_HTTP_ADDR
          value: "http://consul:8500"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 5

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: curso-completo-blue
  namespace: production
  labels:
    app: curso-completo
    version: blue
spec:
  replicas: 3
  selector:
    matchLabels:
      app: curso-completo
      version: blue
  template:
    metadata:
      labels:
        app: curso-completo
        version: blue
    spec:
      containers:
      - name: curso-completo
        image: ghcr.io/qtops/curso-completo:latest
        ports:
        - containerPort: 3002
        env:
        - name: NODE_ENV
          value: "production"
        - name: CURSO_COMPLETO_PORT
          value: "3002"
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: host
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: username
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: password
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3002
          initialDelaySeconds: 45
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3002
          initialDelaySeconds: 10
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
  namespace: production
spec:
  selector:
    app: api-gateway
    version: blue  # Cambia entre blue/green
  ports:
  - port: 80
    targetPort: 3001
  type: LoadBalancer

---
apiVersion: v1
kind: Service
metadata:
  name: curso-completo-service
  namespace: production
spec:
  selector:
    app: curso-completo
    version: blue  # Cambia entre blue/green
  ports:
  - port: 80
    targetPort: 3002
  type: ClusterIP
