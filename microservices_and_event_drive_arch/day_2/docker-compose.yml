services:
  consul:
    image: hashicorp/consul:1.18
    container_name: consul
    restart: always
    ports:
      - "8500:8500"
    command: ["agent", "-dev", "-client=0.0.0.0"]
    healthcheck:
      test: ["CMD", "wget", "-q", "http://localhost:8500/v1/status/leader", "-O", "-"]
      interval: 10s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:15
    container_name: elearning_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: elearning_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
